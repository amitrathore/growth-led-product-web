<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- White disc background -->
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="192"/>
    </clipPath>

    <!-- Radial glow gradient -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFF9E6" stop-opacity="1"/>
      <stop offset="30%"  stop-color="#FFF0C0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF"  stop-opacity="1"/>
    </radialGradient>

    <!-- Ray gradient -->
    <radialGradient id="ray-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6B3FA0"/>
      <stop offset="50%"  stop-color="#3A6FD8"/>
      <stop offset="100%" stop-color="#3A6FD8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer gold ring -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="#D4A853" stroke-width="4"/>

  <!-- White disc -->
  <circle cx="200" cy="200" r="192" fill="white"/>

  <!-- ── Starburst rays (24 points) ── -->
  <g clip-path="url(#circle-clip)">
    <g transform="translate(200,200)">
      <!-- Long thin rays -->
      <g fill="#4A3FB0" opacity="0.85">
        <!-- 24 rays at 15° intervals, alternating long/short -->
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(0)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(15)"/>
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(30)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(45)"/>
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(60)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(75)"/>
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(90)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(105)"/>
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(120)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(135)"/>
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(150)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(165)"/>
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(180)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(195)"/>
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(210)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(225)"/>
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(240)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(255)"/>
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(270)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(285)"/>
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(300)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(315)"/>
        <polygon points="0,-8  -3.5,-95  3.5,-95"  transform="rotate(330)"/>
        <polygon points="0,-6  -2.5,-68  2.5,-68"  transform="rotate(345)"/>
      </g>
    </g>

    <!-- ── Concentric rings (outside-in) ── -->
    <!-- Outermost blue ring -->
    <circle cx="200" cy="200" r="86" fill="none" stroke="#3A6FD8" stroke-width="9" opacity="0.9"/>
    <!-- Purple -->
    <circle cx="200" cy="200" r="76" fill="none" stroke="#6B3FA0" stroke-width="7" opacity="0.9"/>
    <!-- Pink -->
    <circle cx="200" cy="200" r="67" fill="none" stroke="#D946A8" stroke-width="7" opacity="0.9"/>
    <!-- Orange-red -->
    <circle cx="200" cy="200" r="58" fill="none" stroke="#E85D26" stroke-width="7" opacity="0.9"/>
    <!-- Orange -->
    <circle cx="200" cy="200" r="49" fill="none" stroke="#F0892A" stroke-width="7" opacity="0.9"/>
    <!-- Gold-yellow -->
    <circle cx="200" cy="200" r="40" fill="none" stroke="#F5C842" stroke-width="7" opacity="0.95"/>
    <!-- Warm yellow -->
    <circle cx="200" cy="200" r="31" fill="none" stroke="#F5E070" stroke-width="6" opacity="0.95"/>

    <!-- Core warm glow fill -->
    <circle cx="200" cy="200" r="25" fill="url(#core-glow)"/>
    <!-- Bright white centre dot -->
    <circle cx="200" cy="200" r="10" fill="#FFF8DC" opacity="0.95"/>
  </g>
</svg>
